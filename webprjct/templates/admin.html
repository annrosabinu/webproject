{% extends 'base.html' %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<style>
    body {
        background-color: #f8f9fa;
        color: #333;
    }

    .dashboard-header {
        text-align: center;
        padding: 20px;
        background: linear-gradient(to right, #4caf50, #009688);
        color: white;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .dashboard-stats {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .stat-card {
        background: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        margin: 10px;
        width: 200px;
    }

    .stat-card h3 {
        margin-bottom: 10px;
    }

    .stat-card p {
        font-size: 1.2rem;
        font-weight: bold;
        color: #4caf50;
    }

    .btn-logout {
        display: block;
        margin: 20px auto;
        padding: 10px 30px;
        background-color: #dc3545;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1rem;
        text-align: center;
    }

    .btn-logout:hover {
        background-color: #c82333;
    }
</style>

<div class="dashboard-header">
    <h1>Welcome to the Admin Dashboard</h1>
    <!-- <p>Manage your site effectively</p> -->
</div>

<div class="dashboard-stats">
    <div class="stat-card">
        <h3>Total Users</h3>
        <p>150</p>
    </div>
    <div class="stat-card">
        <h3>New Signups</h3>
        <p>12</p>
    </div>
    <div class="stat-card">
        <h3>Active Users</h3>
        <p>85</p>
    </div>
    <div class="stat-card">
        <h3>Feedback Messages</h3>
        <p>30</p>
    </div>
</div>

<a href="{% url 'logout' %}" class="btn-logout">Logout</a>
{% endblock %}
