{% extends 'base.html' %}

{% block title %}Signup{% endblock %}

{% block content %}
<div class="container">
    <!-- Display error messages if any -->
    {% for message in messages %}
    <div class="alert alert-danger mt-5">
        <h5 class="text-center">{{ message }}</h5>
    </div>
    {% endfor %}

    <!-- Signup Form -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="text-center mb-4">Create Account</h3>
                <form action="{% url 'usercreate' %}" method="post">
                    {% csrf_token %}
                    
                    <!-- First Name Field -->
                    <div class="form-group mb-3">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" class="form-control" id="first_name" placeholder="Enter your first name" required>
                    </div>

                    <!-- Last Name Field -->
                    <div class="form-group mb-3">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" class="form-control" id="last_name" placeholder="Enter your last name" required>
                    </div>

                    <!-- Username Field -->
                    <div class="form-group mb-3">
                        <label for="username">Username</label>
                        <input type="text" name="username" class="form-control" id="username" placeholder="Choose a username" required>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group mb-3">
                        <label for="email">Email</label>
                        <input type="email" name="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="Create a password" required>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group mb-3">
                        <label for="cpassword">Confirm Password</label>
                        <input type="password" name="cpassword" class="form-control" id="cpassword" placeholder="Confirm your password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
